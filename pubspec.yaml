name: alqadi_smart_exam_checker
description: Arabic-first offline OMR exam grading app.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: 4.2.0
  pdf: ^3.11.1
  google_fonts: ^6.2.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Amiri-Regular.ttf
