name: Build Android APK

on:
  push:
    branches:
      - feature/flutter-omr-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.alqadi --project-name alqadi_smart_exam_checker --no-pub .
      - name: Configure Android plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          start = s.find("pluginManagement {")
          end = s.find("plugins {", start)
          block = s[start:end if end >= 0 else len(s)]
          additions = []
          if "google()" not in block:
              additions.append("        google()")
          if "mavenCentral()" not in block:
              additions.append("        mavenCentral()")
          if additions:
              insertion = "repositories {" + chr(10) + chr(10).join(additions)
              s = s.replace("repositories {", insertion, 1)
          p.write_text(s)
          print(p.read_text())
          PY
      - name: Download Arabic PDF font
        run: |
          mkdir -p assets/fonts
          curl -fL --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf -o assets/fonts/Amiri-Regular.ttf
          curl -fL --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/OFL.txt -o assets/fonts/OFL-Amiri.txt
          test -s assets/fonts/Amiri-Regular.ttf
      - name: Download offline OCR language models
        run: |
          mkdir -p assets/tessdata
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata -o assets/tessdata/ara.traineddata
          curl -fL --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -o assets/tessdata/eng.traineddata
          test -s assets/tessdata/ara.traineddata
          test -s assets/tessdata/eng.traineddata
          printf '{"files":["ara.traineddata","eng.traineddata"]}' > assets/tessdata_config.json
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the permanent Android signing key before building an installable update."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload.jks
          test -s android/app/release-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'create("release")' not in s:
              s = s.replace("android {", """android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release-upload.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }""", 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Release signing configuration was not applied.")
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alqadi-smart-exam-checker-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
